name: librespeed
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/librespeed/speedtest:latest
    container_name: librespeed-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: librespeed-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      WEBPORT: 8080
      DISTANCE: mi
      MODE: standalone
      DB_TYPE: sqlite
      TELEMETRY: 'true'
      DISABLE_IPINFO: 'false'
      REDACT_IP_ADDRESSES: 'false'
      ENABLE_ID_OBFUSCATION: 'true'
      TITLE: ${APP_ORG_NAME:-LibreSpeed} SpeedTest
      EMAIL: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
      PASSWORD: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      IPINFO_APIKEY: ${IPINFO_APIKEY:-}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:$${WEBPORT}/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/librespeed:/database:z'
      - './volumes/config/librespeed:/config:z'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://librespeed-app:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - librespeed
      - cloudflare

networks:
  librespeed:
    name: librespeed
    external: false
  cloudflare:
    external: true
